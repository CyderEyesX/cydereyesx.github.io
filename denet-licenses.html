      --dn-deep:   #C8941F;  /* deep gold (gradients / shadow)   */

      box-shadow: 0 8px 24px rgba(244, 192, 78, 0.30);

    .dn-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 38px rgba(244, 192, 78, 0.55);
    }
    .dn-btn:focus-visible { outline: 2px solid var(--dn-light); outline-offset: 4px; }

    /* Ghost button */

    .dn-ghost:hover { transform: translateY(-2px); border-color: rgba(244, 192, 78, 0.55); background: rgba(244, 192, 78, 0.08); }

    .dn-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(244, 192, 78, 0.15);

       LANGUAGE TOGGLE (segmented EN | ES switch)
       ========================================================= */

      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(10px);
    }
    .lang-toggle button {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.15em;
      font-size: 11px;
      padding: 7px 16px;
      border-radius: 9999px;
      color: #94a3b8;
      transition: color 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }
    .lang-toggle button[aria-pressed="true"] {
      color: var(--ink);
      background: linear-gradient(135deg, var(--dn), var(--dn-deep));
      box-shadow: 0 4px 14px rgba(244, 192, 78, 0.40);

    .lang-toggle button:focus-visible { outline: 2px solid var(--dn-light); outline-offset: 2px; }

       DeNet logo is reproduced here). Pulsing storage nodes
       sheltered under a protective dome = decentralized storage.
       ========================================================= */
    @keyframes dn-pulse {

    .dn-node:nth-child(3) { animation-delay: 0.8s; }
    .dn-node:nth-child(4) { animation-delay: 1.2s; }
    .dn-node:nth-child(5) { animation-delay: 1.6s; }
    .dn-node:nth-child(6) { animation-delay: 2.0s; }
    .dn-node:nth-child(7) { animation-delay: 2.4s; }

    @keyframes dn-sweep {
      0%   { stroke-dashoffset: 520; opacity: 0.15; }
      50%  { opacity: 0.6; }
      100% { stroke-dashoffset: 0; opacity: 0.15; }
    }
    .dn-dome-arc { stroke-dasharray: 520; animation: dn-sweep 6s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }

    function setLang(lang) {
      const dict = I18N[lang] || I18N.en;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      document.documentElement.lang = lang;
      const enBtn = document.getElementById('lang-en');
      const esBtn = document.getElementById('lang-es');
      if (enBtn && esBtn) {
        enBtn.setAttribute('aria-pressed', String(lang === 'en'));
        esBtn.setAttribute('aria-pressed', String(lang === 'es'));
      }
      try { localStorage.setItem('cyx_denet_lang', lang); } catch (e) {}
    }

    (function initLang() {
      let lang = 'en';
      try {
        const saved = localStorage.getItem('cyx_denet_lang');
        if (saved === 'en' || saved === 'es') lang = saved;
        else if ((navigator.language || '').toLowerCase().startsWith('es')) lang = 'es';
      } catch (e) {}
      setLang(lang);
    })();
  </script>
